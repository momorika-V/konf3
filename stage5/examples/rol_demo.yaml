# Тестовая программа этапа 4: демонстрация побитового
# циклического сдвига влево (rol) с сохранением результата в память.
# rol: память[C] = память[D] циклически сдвинуть влево на память[B]
- load:
    addr: 200      # что сдвигаем
    value: 1
- load:
    addr: 201      # на сколько сдвигаем
    value: 1
- rol:
    dst: 210       # память[210] = rol(1, 1) = 2
    value: 200
    count: 201
- load:
    addr: 202
    value: 65535   # 16 младших битов -- единицы
- load:
    addr: 203
    value: 2
- rol:
    dst: 211       # память[211] = rol(65535, 2) = 262140
    value: 202
    count: 203
- load:
    addr: 204
    value: 1048576 # старший (21-й) бит ячейки
- rol:
    dst: 212       # единица уходит в начало: память[212] = 1
    value: 204
    count: 201
