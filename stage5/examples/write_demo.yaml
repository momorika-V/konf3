# Пример 2 (этап 5): запись в память по указателю со смещением.
# В ячейке 200 лежит указатель 80, команда write пишет значения
# в память[80 + offset].
# Команды занимают адреса 0..69 (7 команд по 10 байт).
- load:
    addr: 200      # ячейка-указатель
    value: 80
- load:
    addr: 210
    value: 11
- load:
    addr: 211
    value: 22
- load:
    addr: 212
    value: 33
- write:
    src: 210       # память[80 + 0] = 11
    offset: 0
    base: 200
- write:
    src: 211       # память[80 + 1] = 22
    offset: 1
    base: 200
- write:
    src: 212       # память[80 + 2] = 33
    offset: 2
    base: 200
