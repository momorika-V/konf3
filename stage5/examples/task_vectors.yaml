# Тестовая задача (этап 5): поэлементный побитовый циклический
# сдвиг влево над двумя векторами длины 5.
# Вектор 1 (данные)     -- адреса 160..164
# Вектор 2 (сдвиги)     -- адреса 170..174
# Результат -- во втором векторе: память[170+i] = rol(память[160+i],
# память[170+i]).
# Команды занимают адреса 0..149 (15 команд по 10 байт).
- load:
    addr: 160
    value: 1
- load:
    addr: 161
    value: 255
- load:
    addr: 162
    value: 1024
- load:
    addr: 163
    value: 12345
- load:
    addr: 164
    value: 1048575
- load:
    addr: 170
    value: 1
- load:
    addr: 171
    value: 2
- load:
    addr: 172
    value: 3
- load:
    addr: 173
    value: 4
- load:
    addr: 174
    value: 5
- rol:
    dst: 170
    value: 160
    count: 170
- rol:
    dst: 171
    value: 161
    count: 171
- rol:
    dst: 172
    value: 162
    count: 172
- rol:
    dst: 173
    value: 163
    count: 173
- rol:
    dst: 174
    value: 164
    count: 174
