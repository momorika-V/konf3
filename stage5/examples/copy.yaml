# Тестовая программа этапа 3: копирование массива из 5 элементов
# с адресов 100..104 на адреса 110..114.
# Команд занимают адреса 0..99, данные -- с адреса 100.
- load:
    addr: 100
    value: 11
- load:
    addr: 101
    value: 22
- load:
    addr: 102
    value: 33
- load:
    addr: 103
    value: 44
- load:
    addr: 104
    value: 55
- read:
    dst: 110
    src: 100
- read:
    dst: 111
    src: 101
- read:
    dst: 112
    src: 102
- read:
    dst: 113
    src: 103
- read:
    dst: 114
    src: 104
